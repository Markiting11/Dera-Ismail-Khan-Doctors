<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Test - DocFinder</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { margin: 5px; padding: 10px 15px; border: none; border-radius: 3px; cursor: pointer; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-warning { background-color: #ffc107; color: black; }
        pre { background-color: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔧 DocFinder Database Test</h1>
    
    <div class="test-section info">
        <h3>📋 Test Overview</h3>
        <p>This page tests all database operations to identify issues with adding new data.</p>
    </div>

    <div class="test-section">
        <h3>🧪 Basic localStorage Tests</h3>
        <button onclick="testLocalStorageBasic()" class="btn-primary">Test Basic localStorage</button>
        <button onclick="testLocalStorageCapacity()" class="btn-primary">Test localStorage Capacity</button>
        <div id="basic-test-output"></div>
    </div>

    <div class="test-section">
        <h3>👨‍⚕️ Doctor Data Tests</h3>
        <button onclick="testDoctorOperations()" class="btn-success">Test Doctor CRUD Operations</button>
        <button onclick="testDoctorValidation()" class="btn-success">Test Doctor Validation</button>
        <button onclick="testDoctorPersistence()" class="btn-success">Test Data Persistence</button>
        <div id="doctor-test-output"></div>
    </div>

    <div class="test-section">
        <h3>🗄️ Current Database State</h3>
        <button onclick="showCurrentState()" class="btn-warning">Show Current State</button>
        <button onclick="clearAllData()" class="btn-danger">Clear All Data</button>
        <div id="state-output"></div>
    </div>

    <div class="test-section">
        <h3>🔍 Debug Information</h3>
        <button onclick="showDebugInfo()" class="btn-primary">Show Debug Info</button>
        <div id="debug-output"></div>
    </div>

    <script>
        // Sample doctor data structure
        const SAMPLE_DOCTORS = [
            {
                id: 'doc1',
                name: 'Dr. Muhammad Ahmed Khan',
                specialty: 'Cardiologist',
                city: 'Lahore',
                address: 'Gulberg Medical Center, Block M, Gulberg III, Lahore',
                phone: '+92-42-35714000',
                workingHours: 'Mon-Fri: 9:00 AM - 5:00 PM, Sat: 10:00 AM - 2:00 PM',
                gmbLink: 'https://goo.gl/maps/example-lahore-cardiologist',
                whatsappLink: 'https://wa.me/923001234567'
            },
            {
                id: 'doc2',
                name: 'Dr. Fatima Sheikh',
                specialty: 'Pediatrician',
                city: 'Karachi',
                address: 'Clifton Medical Center, Block 4, Clifton, Karachi',
                phone: '+92-21-35831234',
                workingHours: 'Mon-Sat: 8:00 AM - 6:00 PM',
                gmbLink: 'https://goo.gl/maps/example-karachi-pediatrician'
            }
        ];

        function log(message, elementId = 'basic-test-output') {
            const output = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            output.innerHTML += `<p>[${timestamp}] ${message}</p>`;
        }

        function testLocalStorageBasic() {
            const output = document.getElementById('basic-test-output');
            output.innerHTML = '<h4>Basic localStorage Test Results:</h4>';
            
            try {
                // Test 1: Check if localStorage is available
                if (typeof(Storage) !== "undefined") {
                    log('✅ localStorage is available');
                } else {
                    log('❌ localStorage is not available');
                    return;
                }

                // Test 2: Test basic read/write
                localStorage.setItem('test_key', 'test_value');
                const retrieved = localStorage.getItem('test_key');
                if (retrieved === 'test_value') {
                    log('✅ Basic read/write test passed');
                } else {
                    log('❌ Basic read/write test failed');
                }

                // Test 3: Test JSON serialization
                const testObject = { name: 'Test', value: 123 };
                localStorage.setItem('test_object', JSON.stringify(testObject));
                const retrievedObject = JSON.parse(localStorage.getItem('test_object'));
                if (retrievedObject.name === 'Test' && retrievedObject.value === 123) {
                    log('✅ JSON serialization test passed');
                } else {
                    log('❌ JSON serialization test failed');
                }

                // Cleanup
                localStorage.removeItem('test_key');
                localStorage.removeItem('test_object');
                log('✅ Cleanup completed');

            } catch (error) {
                log(`❌ Error in basic test: ${error.message}`);
            }
        }

        function testLocalStorageCapacity() {
            const output = document.getElementById('basic-test-output');
            output.innerHTML += '<h4>localStorage Capacity Test:</h4>';
            
            try {
                // Test localStorage capacity
                let testData = '';
                let counter = 0;
                
                while (true) {
                    try {
                        testData += 'A'.repeat(1000); // Add 1KB at a time
                        localStorage.setItem('capacity_test', testData);
                        counter++;
                    } catch (e) {
                        if (e.name === 'QuotaExceededError') {
                            log(`✅ localStorage capacity reached at ~${counter}KB`);
                            break;
                        } else {
                            throw e;
                        }
                    }
                }
                
                localStorage.removeItem('capacity_test');
                log('✅ Capacity test cleanup completed');
                
            } catch (error) {
                log(`❌ Error in capacity test: ${error.message}`);
            }
        }

        function testDoctorOperations() {
            const output = document.getElementById('doctor-test-output');
            output.innerHTML = '<h4>Doctor CRUD Operations Test:</h4>';
            
            try {
                // Test 1: Add doctors
                log('Testing doctor addition...');
                localStorage.setItem('docfinder_doctors', JSON.stringify(SAMPLE_DOCTORS));
                let doctors = JSON.parse(localStorage.getItem('docfinder_doctors'));
                log(`✅ Added ${doctors.length} sample doctors`);

                // Test 2: Add new doctor
                const newDoctor = {
                    id: 'doc' + Date.now(),
                    name: 'Dr. Test Doctor',
                    specialty: 'Test Specialty',
                    city: 'Test City',
                    address: 'Test Address',
                    phone: '+92-123-456789',
                    workingHours: 'Mon-Fri: 9:00 AM - 5:00 PM'
                };
                
                doctors.push(newDoctor);
                localStorage.setItem('docfinder_doctors', JSON.stringify(doctors));
                log(`✅ Added new doctor: ${newDoctor.name}`);

                // Test 3: Update doctor
                const doctorToUpdate = doctors.find(d => d.id === newDoctor.id);
                if (doctorToUpdate) {
                    doctorToUpdate.specialty = 'Updated Specialty';
                    localStorage.setItem('docfinder_doctors', JSON.stringify(doctors));
                    log('✅ Updated doctor specialty');
                }

                // Test 4: Delete doctor
                doctors = doctors.filter(d => d.id !== newDoctor.id);
                localStorage.setItem('docfinder_doctors', JSON.stringify(doctors));
                log('✅ Deleted test doctor');

                // Test 5: Verify final state
                const finalDoctors = JSON.parse(localStorage.getItem('docfinder_doctors'));
                if (finalDoctors.length === SAMPLE_DOCTORS.length) {
                    log('✅ CRUD operations test completed successfully');
                } else {
                    log(`❌ CRUD test failed: expected ${SAMPLE_DOCTORS.length}, got ${finalDoctors.length}`);
                }

            } catch (error) {
                log(`❌ Error in CRUD test: ${error.message}`);
            }
        }

        function testDoctorValidation() {
            const output = document.getElementById('doctor-test-output');
            output.innerHTML += '<h4>Doctor Validation Test:</h4>';
            
            try {
                // Test valid doctor
                const validDoctor = {
                    id: 'valid-doc',
                    name: 'Dr. Valid Doctor',
                    specialty: 'Valid Specialty',
                    city: 'Valid City',
                    address: 'Valid Address',
                    phone: '+92-123-456789',
                    workingHours: 'Mon-Fri: 9:00 AM - 5:00 PM'
                };
                
                if (validDoctor.name && validDoctor.specialty && validDoctor.city && validDoctor.address) {
                    log('✅ Valid doctor data structure test passed');
                } else {
                    log('❌ Valid doctor data structure test failed');
                }

                // Test invalid doctor (missing required fields)
                const invalidDoctor = {
                    id: 'invalid-doc',
                    name: '',
                    specialty: 'Valid Specialty',
                    city: 'Valid City',
                    address: '',
                    phone: '+92-123-456789'
                };
                
                if (!invalidDoctor.name || !invalidDoctor.address) {
                    log('✅ Invalid doctor validation test passed');
                } else {
                    log('❌ Invalid doctor validation test failed');
                }

            } catch (error) {
                log(`❌ Error in validation test: ${error.message}`);
            }
        }

        function testDoctorPersistence() {
            const output = document.getElementById('doctor-test-output');
            output.innerHTML += '<h4>Data Persistence Test:</h4>';
            
            try {
                // Save test data
                const testDoctors = [
                    {
                        id: 'persist-test-1',
                        name: 'Dr. Persistence Test 1',
                        specialty: 'Test Specialty 1',
                        city: 'Test City 1',
                        address: 'Test Address 1',
                        phone: '+92-111-111111',
                        workingHours: 'Mon-Fri: 9:00 AM - 5:00 PM'
                    },
                    {
                        id: 'persist-test-2',
                        name: 'Dr. Persistence Test 2',
                        specialty: 'Test Specialty 2',
                        city: 'Test City 2',
                        address: 'Test Address 2',
                        phone: '+92-222-222222',
                        workingHours: 'Mon-Fri: 9:00 AM - 5:00 PM'
                    }
                ];
                
                localStorage.setItem('docfinder_doctors', JSON.stringify(testDoctors));
                log('✅ Test data saved');

                // Simulate page reload by reading from localStorage
                const retrievedDoctors = JSON.parse(localStorage.getItem('docfinder_doctors'));
                if (retrievedDoctors && retrievedDoctors.length === 2) {
                    log('✅ Data persistence test passed');
                } else {
                    log('❌ Data persistence test failed');
                }

            } catch (error) {
                log(`❌ Error in persistence test: ${error.message}`);
            }
        }

        function showCurrentState() {
            const output = document.getElementById('state-output');
            output.innerHTML = '<h4>Current Database State:</h4>';
            
            try {
                const doctors = localStorage.getItem('docfinder_doctors');
                if (doctors) {
                    const parsed = JSON.parse(doctors);
                    log(`📊 Total doctors: ${parsed.length}`, 'state-output');
                    log(`💾 Data size: ${(doctors.length / 1024).toFixed(2)} KB`, 'state-output');
                    output.innerHTML += `<pre>${JSON.stringify(parsed, null, 2)}</pre>`;
                } else {
                    log('ℹ️ No doctors data found in localStorage', 'state-output');
                }
            } catch (error) {
                log(`❌ Error reading current state: ${error.message}`, 'state-output');
            }
        }

        function clearAllData() {
            if (confirm('Are you sure you want to clear all data?')) {
                localStorage.removeItem('docfinder_doctors');
                const output = document.getElementById('state-output');
                output.innerHTML = '<h4>Data Cleared:</h4>';
                log('✅ All data cleared from localStorage', 'state-output');
            }
        }

        function showDebugInfo() {
            const output = document.getElementById('debug-output');
            output.innerHTML = '<h4>Debug Information:</h4>';
            
            try {
                log('🔍 Browser Information:', 'debug-output');
                log(`User Agent: ${navigator.userAgent}`, 'debug-output');
                log(`localStorage available: ${typeof(Storage) !== "undefined"}`, 'debug-output');
                log(`localStorage quota: ~${(localStorage.length / 1024).toFixed(2)} KB used`, 'debug-output');
                
                log('📋 localStorage Keys:', 'debug-output');
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    const value = localStorage.getItem(key);
                    log(`Key: ${key}, Size: ${value ? (value.length / 1024).toFixed(2) + ' KB' : '0 KB'}`, 'debug-output');
                }
                
                log('🕒 Timestamp: ' + new Date().toISOString(), 'debug-output');
                
            } catch (error) {
                log(`❌ Error in debug info: ${error.message}`, 'debug-output');
            }
        }

        // Auto-run basic test on page load
        window.onload = function() {
            log('🚀 Database test page loaded');
            testLocalStorageBasic();
        };
    </script>
</body>
</html>
